[workspace]
resolver = "2"
members = [
    "crates/linguistics",
    "crates/synth",
    "crates/audio",
    "crates/core",
    "crates/mcp",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "sync", "time", "signal", "macros"] }
cpal = "0.15"
unicode-normalization = "0.1"
unicode-segmentation = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
parking_lot = "0.12"
